<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Fantasy Intel</title>
  <script>
    const target = new URL('https://justindema76.github.io/football-playoffs-app/');
    const source = new URLSearchParams(window.location.search);
    for (const [key, value] of source) target.searchParams.set(key, value);
    if (!target.searchParams.get('team')) target.searchParams.set('team', '6');
    window.location.replace(target.toString() + (window.location.hash || ''));
  </script>
</head>
<body><p>Opening the main Fantasy Intel app…</p></body>
</html>
