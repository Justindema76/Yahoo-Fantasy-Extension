<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fantasy Intel Yahoo Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">FANTASY INTEL</div>
    <h1>Yahoo League Sync <small style="font-size:10px;color:#53d7ff">v3.3.0</small></h1>
    <p id="leagueLabel" class="league">Battle of the Kings · League 497223</p>
    <div class="my-team"><span>YOUR TEAM</span><b id="teamName">Open your Yahoo team page</b><small id="teamKey">Your team will be detected from Yahoo</small></div>

    <button id="syncButton" class="primary">SYNC YAHOO</button>
    <button id="openButton" class="secondary">OPEN FANTASY INTEL</button>

    <section id="status" class="status">
      <b id="statusTitle">Ready</b>
      <p id="statusText">Open your own Battle of the Kings team page once. Fantasy Intel will remember which Yahoo team is yours.</p>
    </section>

    <div id="stats" class="stats" hidden>
      <div><b id="teamsCount">0</b><span>TEAMS</span></div>
      <div><b id="playersCount">0</b><span>ROSTER</span></div>
      <div><b id="matchedCount">0</b><span>WEEKLY</span></div>
      <div><b id="unmatchedCount">0</b><span>AVAILABLE</span></div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
