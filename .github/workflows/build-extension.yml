name: Build Chrome Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          PACKAGE_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "Manifest version: $MANIFEST_VERSION"
          echo "VERSION file: $FILE_VERSION"
          echo "package.json: $PACKAGE_VERSION"
          test "$MANIFEST_VERSION" = "$FILE_VERSION"
          test "$MANIFEST_VERSION" = "$PACKAGE_VERSION"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check background.js
          node --check identity-bridge.js
          node --check db-normalizer.js
          node --check league-sync.js
          node --check overlay.js
          node --check popup.js
          find app/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify single-page Fantasy Intel app
        shell: bash
        run: |
          test -f app/index.html
          test -f app/all-matchups.html
          test -f app/css/site.css
          test "$(find app/css -maxdepth 1 -type f -name '*.css' | wc -l | tr -d ' ')" = "1"
          test -f app/js/site.js
          test ! -f app/team.html
          test ! -f app/players.html
          test ! -f app/league.html

      - name: Build extension ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/Fantasy-Intel-Yahoo-Extension-${{ github.ref_name }}.zip" \
            manifest.json \
            background.js \
            identity-bridge.js \
            db-normalizer.js \
            league-sync.js \
            overlay.js \
            popup.html \
            popup.css \
            popup.js \
            app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-intel-yahoo-extension
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "Fantasy Intel Yahoo Extension ${{ github.ref_name }}" \
            --generate-notes