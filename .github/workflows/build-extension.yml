name: Build Chrome Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          PACKAGE_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "Manifest version: $MANIFEST_VERSION"
          echo "VERSION file: $FILE_VERSION"
          echo "package.json: $PACKAGE_VERSION"
          test "$MANIFEST_VERSION" = "$FILE_VERSION"
          test "$MANIFEST_VERSION" = "$PACKAGE_VERSION"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check background.js
          node --check league-sync.js
          node --check overlay.js
          node --check popup.js
          for file in app/js/*.js app/js/views/*.js; do node --check "$file"; done

      - name: Build extension ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/Fantasy-Intel-Yahoo-Extension-${{ github.ref_name }}.zip" \
            manifest.json \
            background.js \
            league-sync.js \
            overlay.js \
            popup.html \
            popup.css \
            popup.js \
            app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-intel-yahoo-extension
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "Fantasy Intel Yahoo Extension ${{ github.ref_name }}" \
            --generate-notes
