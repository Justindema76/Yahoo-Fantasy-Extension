<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Players · Fantasy Intel</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body data-page="players">
  <div class="shell">
    <header class="topbar"><div class="brand"><p class="eyebrow">FANTASY INTEL</p><h1>Players</h1><p class="subline">Yahoo waivers & free agents · <span id="syncStamp">Yahoo synced</span></p></div><button id="refreshButton" class="refresh-button" type="button">REFRESH</button></header>
    <nav class="nav" aria-label="Fantasy Intel pages"><a data-nav="team" href="../team/">TEAM</a><a data-nav="matchup" href="../matchup/">MATCHUP</a><a data-nav="players" href="../players/">PLAYERS</a><a data-nav="league" href="../league/">LEAGUE</a></nav>
    <div id="notice" class="notice" hidden></div>
    <section class="card">
      <div class="card-head"><div><p class="eyebrow">PLAYER POOL</p><h2>Waivers & Available</h2><p>Yahoo availability tied directly to Fantasy Intel.</p></div><span class="week-chip" id="weekLabel">Week 1</span></div>
      <div class="filters"><input id="playerSearch" type="search" placeholder="Search players…" autocomplete="off"><select id="positionFilter" aria-label="Position"><option value="">ALL POS</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select><select id="statusFilter" aria-label="Availability"><option value="AVAILABLE">AVAILABLE</option><option value="FREE_AGENT">FREE AGENT</option><option value="WAIVERS">WAIVERS</option><option value="ROSTERED">ROSTERED</option><option value="ALL">ALL</option></select><select id="sortFilter" aria-label="Sort"><option value="INTEL">INTEL</option><option value="PROJ">PROJECTION</option><option value="RANK">YAHOO RANK</option></select></div>
      <div id="playerCount" class="results-meta">0 players</div><div id="playerPool"></div>
    </section>
  </div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
