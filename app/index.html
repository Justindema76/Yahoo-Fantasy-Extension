<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>My Matchup · Fantasy Intel</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/player-drawer.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>
<body data-page="matchup">
  <div class="shell">
    <header class="topbar compact-topbar">
      <div class="brand">
        <p class="eyebrow">FANTASY INTEL</p>
        <h1>My Matchup</h1>
        <p class="subline">House of the Dragon · <span id="syncStamp">Yahoo synced</span></p>
      </div>
      <button id="refreshButton" class="refresh-button" type="button">REFRESH</button>
    </header>
    <nav class="nav" aria-label="Fantasy Intel pages">
      <a data-nav="team" href="./team.html">TEAM</a>
      <a data-nav="matchup" href="./">MATCHUP</a>
      <a data-nav="players" href="./players.html">PLAYERS</a>
      <a data-nav="league" href="./league.html">LEAGUE</a>
    </nav>
    <div id="notice" class="notice" hidden></div>
    <section class="card matchup-card-shell">
      <div class="matchup-toolbar">
        <div class="week-controls">
          <button id="prevWeek" type="button" aria-label="Previous week">‹</button>
          <select id="weekSelect" aria-label="Select week"></select>
          <button id="nextWeek" type="button" aria-label="Next week">›</button>
        </div>
        <a id="allMatchupsLink" class="all-matchups-link" href="./all-matchups.html">ALL MATCHUPS</a>
      </div>
      <div id="scoreArea"></div>
      <div id="matchupBody" class="matchup-list"></div>
      <div class="bench-bar"><button id="benchToggle" class="bench-toggle" type="button">SHOW OPPONENT BENCH ▼</button></div>
      <div id="opponentBenchWrap" hidden>
        <div id="opponentBenchTitle" class="opponent-bench-title">Opponent Bench</div>
        <div id="opponentBench"></div>
      </div>
    </section>
  </div>
  <script type="module" src="./js/site.js"></script>
</body>
</html>
