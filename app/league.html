<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>League · Fantasy Intel</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/player-drawer.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>
<body data-page="league">
  <div class="shell">
    <header class="topbar compact-topbar">
      <div class="brand"><p class="eyebrow">BATTLE OF THE KINGS</p><h1>League</h1><p class="subline">Current manager rosters · <span id="syncStamp">Yahoo synced</span></p></div>
      <button id="refreshButton" class="refresh-button" type="button">REFRESH</button>
    </header>
    <nav class="nav" aria-label="Fantasy Intel pages">
      <a data-nav="team" href="./team.html">TEAM</a><a data-nav="matchup" href="./">MATCHUP</a><a data-nav="players" href="./players.html">PLAYERS</a><a data-nav="league" href="./league.html">LEAGUE</a>
    </nav>
    <div id="notice" class="notice" hidden></div>
    <section class="card">
      <div class="league-actions">
        <div class="week-controls"><button id="prevWeek" type="button">‹</button><select id="weekSelect"></select><button id="nextWeek" type="button">›</button></div>
        <a class="all-matchups-link" href="./all-matchups.html" id="allMatchupsLink">ALL MATCHUPS</a>
      </div>
      <div class="manager-panel">
        <div><label for="managerSelect">MANAGER / TEAM</label><select id="managerSelect" class="manager-select"></select></div>
        <div class="manager-scorebox"><div><span>POINTS</span><b id="managerScore">—</b></div><div><span>PROJECTED</span><b id="managerProjection">—</b></div></div>
      </div>
      <div class="section-label" id="managerRosterTitle">HOUSE OF THE DRAGON</div>
      <div id="managerRoster"></div>
    </section>
  </div>
  <script type="module" src="./js/site.js"></script>
</body>
</html>
