<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="robots" content="noindex">
  <title>All Matchups · Fantasy Intel</title>
  <link rel="stylesheet" href="./css/site.css">
  <link rel="stylesheet" href="./css/player-drawer.css">
</head>
<body data-page="all-matchups">
  <div class="shell">
    <header class="standalone-head">
      <a id="backToApp" class="back-link" href="./">‹ MY MATCHUP</a>
      <div><p class="eyebrow">BATTLE OF THE KINGS</p><h1>All Matchups</h1><p class="subline"><span id="syncStamp">Yahoo synced</span></p></div>
      <button id="refreshButton" class="refresh-button" type="button">REFRESH</button>
    </header>
    <div id="notice" class="notice" hidden></div>
    <section class="card">
      <div class="week-toolbar"><div class="week-controls"><button id="prevWeek" type="button" aria-label="Previous week">‹</button><select id="weekSelect" aria-label="Select week"></select><button id="nextWeek" type="button" aria-label="Next week">›</button></div></div>
      <div id="allMatchupsList"></div>
    </section>
  </div>
  <script type="module" src="./js/site.js"></script>
</body>
</html>
