<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>My Team · Fantasy Intel</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <link rel="stylesheet" href="./css/player-drawer.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>
<body data-page="team">
  <div class="shell">
    <header class="topbar compact-topbar">
      <div class="brand">
        <p class="eyebrow">MY TEAM</p>
        <h1>House of the Dragon</h1>
        <p class="subline">Battle of the Kings · <span id="syncStamp">Yahoo synced</span></p>
      </div>
      <button id="refreshButton" class="refresh-button" type="button">REFRESH</button>
    </header>
    <nav class="nav" aria-label="Fantasy Intel pages">
      <a data-nav="team" href="./team.html">TEAM</a>
      <a data-nav="matchup" href="./">MATCHUP</a>
      <a data-nav="players" href="./players.html">PLAYERS</a>
      <a data-nav="league" href="./league.html">LEAGUE</a>
    </nav>
    <div id="notice" class="notice" hidden></div>
    <section class="card">
      <div class="team-week-toolbar">
        <div class="week-controls">
          <button id="prevWeek" type="button" aria-label="Previous week">‹</button>
          <select id="weekSelect" aria-label="Select week"></select>
          <button id="nextWeek" type="button" aria-label="Next week">›</button>
        </div>
      </div>
      <div class="team-week-score">
        <div><span id="teamWeekTitle">Week 1</span><strong id="teamScore">—</strong><small>POINTS</small></div>
        <div><span>PROJECTED</span><strong id="teamProjection">—</strong><small>YAHOO</small></div>
      </div>
      <div class="section-label">STARTERS</div>
      <div id="teamStarters"></div>
      <div class="section-label">BENCH / IR</div>
      <div id="teamBench"></div>
    </section>
  </div>
  <script type="module" src="./js/site.js"></script>
</body>
</html>
