<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>League · Fantasy Intel</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body data-page="league">
  <div class="shell">
    <header class="topbar"><div class="brand"><p class="eyebrow">FANTASY INTEL</p><h1>League</h1><p class="subline">Battle of the Kings · <span id="syncStamp">Yahoo synced</span></p></div><button id="refreshButton" class="refresh-button" type="button">REFRESH</button></header>
    <nav class="nav" aria-label="Fantasy Intel pages"><a data-nav="team" href="../team/">TEAM</a><a data-nav="matchup" href="../matchup/">MATCHUP</a><a data-nav="players" href="../players/">PLAYERS</a><a data-nav="league" href="../league/">LEAGUE</a></nav>
    <div id="notice" class="notice" hidden></div>
    <section class="card">
      <div class="card-head matchup-head"><div><p class="eyebrow">ALL MATCHUPS</p><h2>Battle of the Kings</h2><p>Every matchup for the selected week. Open any team to see its players.</p></div><div class="week-controls"><button id="prevWeek" type="button" aria-label="Previous week">‹</button><select id="weekSelect" aria-label="Select week"></select><button id="nextWeek" type="button" aria-label="Next week">›</button></div></div>
      <div id="leagueMatchups"></div>
    </section>
    <section class="card">
      <div class="manager-panel"><div><label for="managerSelect">MANAGER / TEAM</label><select id="managerSelect" class="manager-select"></select></div><div class="manager-title-wrap"><p class="eyebrow">CURRENT ROSTER</p><h2 id="managerRosterTitle">House of the Dragon</h2></div></div>
      <div id="managerRoster"></div>
    </section>
  </div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
